name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Deterministic checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install system check tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build generated runtime
        run: npm run build

      - name: Verify generated runtime is clean
        run: git diff --exit-code -- pi-extension/dist

      - name: Run local check gate
        run: npm run check

      - name: Validate PR changelog declaration
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/validation/check-changelog.mjs

      - name: Run deterministic tests
        run: npm test

      - name: Verify worktree is clean
        run: test -z "$(git status --porcelain)"

  # The suites with platform-specific code (paths, symlinks and Windows directory junctions in Task Memory) on the other
  # two systems users run Freeflow on. Not a required check: "Deterministic checks" alone gates merging.
  platforms:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Use Git Bash for npm scripts on Windows
        if: runner.os == 'Windows'
        run: npm config set script-shell "C:\\Program Files\\Git\\bin\\bash.exe"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Track Work tests
        run: npm run test:track-work

      - name: Pi extension tests
        run: npm run test:pi-extension
