name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check gate and the test shards run in parallel; "Deterministic checks" below is the required check and passes
  # only when every one of them passed.
  gate:
    name: Check gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install system check tools
        run: command -v rg >/dev/null || { sudo apt-get update && sudo apt-get install --no-install-recommends -y ripgrep; }

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build generated runtime
        run: npm run build

      - name: Verify generated runtime is clean
        run: git diff --exit-code -- pi-extension/dist

      # Prettier's cache keyed on file content, so a fresh checkout still hits it.
      - name: Restore format cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/prettier
          key: prettier-${{ hashFiles('package-lock.json', '.prettierrc*', '.prettierignore') }}-${{ github.sha }}
          restore-keys: prettier-${{ hashFiles('package-lock.json', '.prettierrc*', '.prettierignore') }}-

      - name: Run local check gate
        run: npm run check

      - name: Validate PR changelog declaration
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/validation/check-changelog.mjs

      - name: Verify worktree is clean
        run: test -z "$(git status --porcelain)"

  tests:
    name: Tests ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install system check tools
        run: command -v rg >/dev/null || { sudo apt-get update && sudo apt-get install --no-install-recommends -y ripgrep; }

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # One shard of npm test: test-shard.mjs deals every suite npm test lists to exactly one shard.
      - name: Run deterministic tests
        run: node scripts/validation/test-shard.mjs ${{ matrix.shard }}

      - name: Verify worktree is clean
        run: test -z "$(git status --porcelain)"

  check:
    name: Deterministic checks
    if: always()
    needs: [gate, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Every check gate and test shard passed
        env:
          GATE: ${{ needs.gate.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "check gate: $GATE; test shards: $TESTS"
          test "$GATE" = success && test "$TESTS" = success
