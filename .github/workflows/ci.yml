name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Deterministic checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install system check tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build generated runtime
        run: npm run build

      - name: Verify generated runtime is clean
        run: git diff --exit-code -- pi-extension/dist

      - name: Run local check gate
        run: npm run check

      - name: Validate PR changelog declaration
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/validation/check-changelog.mjs

      - name: Run deterministic tests
        run: |
          npm run test:pi-extension
          npm run test:skill-author
          npm run test:skill-eval
          npm run test:track-work
          npm run test:freeflow-snapshot
          npm run test:release-utils
          npm run test:release-workflow
          npm run test:changelog
          npm run test:docs

      - name: Verify worktree is clean
        run: test -z "$(git status --porcelain)"
