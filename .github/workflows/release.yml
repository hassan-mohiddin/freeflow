name: Release npm package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify and release (for recovery)
        required: true
        type: string
      dist_tag:
        description: npm dist-tag to publish
        required: true
        default: latest
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  NPM_DIST_TAG: ${{ inputs.dist_tag || 'latest' }}

jobs:
  publish:
    name: Verify and publish release
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install system check tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify release identity
        run: |
          node scripts/validation/check-release-version.mjs \
            --tag "$RELEASE_TAG"

      - name: Build
        run: npm run build

      - name: Verify generated runtime is clean
        run: git diff --exit-code -- pi-extension/dist

      - name: Run deterministic checks
        run: npm run check

      - name: Run release metadata checks
        run: npm run check:release-metadata

      - name: Validate changelog structure
        run: npm run check:changelog

      - name: Run release-focused tests
        run: |
          npm run test:pi-extension
          npm run test:host-manifests
          npm run test:skill-author
          npm run test:skill-eval
          npm run test:track-work
          npm run test:freeflow-snapshot
          npm run test:release-utils
          npm run test:release-workflow
          npm run test:changelog
          npm run test:docs

      - name: Verify worktree is clean
        run: test -z "$(git status --porcelain)"

      - name: Extract changelog release notes
        run: |
          node scripts/release-notes.mjs \
            --version "${RELEASE_TAG#v}" \
            --out "$RUNNER_TEMP/RELEASE_NOTES.md"
          test -s "$RUNNER_TEMP/RELEASE_NOTES.md"

      - name: Pack exact release artifact
        env:
          RELEASE_DIR: ${{ runner.temp }}/freeflow-release
        run: |
          set -euo pipefail
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          pack_manifest="$RELEASE_DIR/pack.json"
          npm pack --ignore-scripts \
            --pack-destination "$RELEASE_DIR" \
            --json > "$pack_manifest"
          filename="$(jq -r '.[0].filename // empty' "$pack_manifest")"
          shasum="$(jq -r '.[0].shasum // empty' "$pack_manifest")"
          integrity="$(jq -r '.[0].integrity // empty' "$pack_manifest")"
          test -n "$filename"
          test -n "$shasum"
          test -n "$integrity"
          {
            printf 'RELEASE_TARBALL=%s\n' "$RELEASE_DIR/$filename"
            printf 'RELEASE_SHASUM=%s\n' "$shasum"
            printf 'RELEASE_INTEGRITY=%s\n' "$integrity"
          } >> "$GITHUB_ENV"

      - name: Publish npm package when not already published
        env:
          PACKAGE_NAME: "@hassangameryt/freeflow"
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          release_dir="$RUNNER_TEMP/freeflow-release"
          registry_dist="$release_dir/registry-dist.json"
          registry_error="$release_dir/registry-error.log"
          if npm view "$PACKAGE_NAME@$version" dist --json \
            > "$registry_dist" 2> "$registry_error"; then
            registry_shasum="$(jq -r '.shasum // empty' "$registry_dist")"
            if [ "$registry_shasum" != "$RELEASE_SHASUM" ]; then
              echo "Published artifact checksum does not match the tag." >&2
              exit 1
            fi
            echo "$PACKAGE_NAME@$version already matches the tag artifact."
          else
            if ! rg -q 'E404|404 Not Found' "$registry_error"; then
              cat "$registry_error" >&2
              exit 1
            fi
            npm publish "$RELEASE_TARBALL" \
              --access public \
              --tag "$NPM_DIST_TAG" \
              --provenance
          fi

      - name: Verify published npm artifact
        env:
          PACKAGE_NAME: "@hassangameryt/freeflow"
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          release_dir="$RUNNER_TEMP/freeflow-release"
          registry_dist="$release_dir/published-dist.json"
          registry_error="$release_dir/published-error.log"
          registry_attempts=18
          registry_delay_seconds=10
          for attempt in $(seq 1 "$registry_attempts"); do
            if npm view "$PACKAGE_NAME@$version" dist --json \
              > "$registry_dist" 2> "$registry_error"; then
              registry_shasum="$(jq -r '.shasum // empty' "$registry_dist")"
              registry_integrity="$(jq -r '.integrity // empty' "$registry_dist")"
              if [ "$registry_shasum" != "$RELEASE_SHASUM" ] ||
                [ "$registry_integrity" != "$RELEASE_INTEGRITY" ]; then
                echo "Published artifact checksum or integrity does not match the tag artifact." >&2
                cat "$registry_dist" >&2
                exit 1
              fi
              registry_predicate="$(jq -r '.attestations.provenance.predicateType // empty' "$registry_dist")"
              if [ "$registry_predicate" = "https://slsa.dev/provenance/v1" ]; then
                echo "Published npm artifact verified on attempt $attempt."
                exit 0
              fi
              echo "Artifact metadata matches, but npm provenance is not visible yet (attempt $attempt/$registry_attempts)."
            else
              if ! rg -q 'E404|404 Not Found' "$registry_error"; then
                cat "$registry_error" >&2
                exit 1
              fi
              echo "Published npm version is not visible yet (attempt $attempt/$registry_attempts)."
            fi
            if [ "$attempt" -eq "$registry_attempts" ]; then
              echo "Timed out waiting for the published npm artifact and provenance to become visible." >&2
              cat "$registry_error" >&2 || true
              exit 1
            fi
            sleep "$registry_delay_seconds"
          done

      - name: Create GitHub Release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists;"
            echo "leaving it unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md"
