name: Release npm package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify and release (for recovery)
        required: true
        type: string
      dist_tag:
        description: npm dist-tag to publish
        required: true
        default: latest
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  NPM_DIST_TAG: ${{ inputs.dist_tag || 'latest' }}

jobs:
  publish:
    name: Verify and publish release
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install system check tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify release identity
        run: |
          node scripts/validation/check-release-version.mjs \
            --tag "$RELEASE_TAG"

      - name: Build
        run: npm run build

      - name: Run deterministic checks
        run: npm run check

      - name: Run release metadata checks
        run: npm run check:release-metadata

      - name: Run release-focused tests
        run: |
          npm run test:pi-extension
          npm run test:skill-author
          npm run test:skill-eval
          npm run test:track-work
          npm run test:freeflow-snapshot
          npm run test:release-utils

      - name: Publish npm package when not already published
        env:
          PACKAGE_NAME: "@hassangameryt/freeflow"
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          published_version="$(
            npm view "${PACKAGE_NAME}@${version}" version 2>/dev/null || true
          )"
          if [ "$published_version" = "$version" ]; then
            echo "${PACKAGE_NAME}@${version} is already published;"
            echo "continuing as release recovery."
            exit 0
          fi
          npm publish --access public --tag "$NPM_DIST_TAG" --provenance

      - name: Extract changelog release notes
        run: |
          node scripts/release-notes.mjs \
            --version "${RELEASE_TAG#v}" \
            --out "$RUNNER_TEMP/RELEASE_NOTES.md"

      - name: Create GitHub Release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists;"
            echo "leaving it unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md"
