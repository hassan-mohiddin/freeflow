name: npm audit

# Weekly check of the installed packages against npm's advisory database and registry signatures, as Pi does daily.
# Freeflow ships no third-party code, so this covers the build tools; a red run means updating by hand.
on:
  schedule:
    - cron: "37 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit for known vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Verify registry signatures
        run: npm audit signatures
