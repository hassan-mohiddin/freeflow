name: Windows tests

# Freeflow on Pi does not support Windows yet: messaging's Unix socket, background process stops and many tests assume
# macOS or Linux (task-008 "Windows support on Pi"). This runs the suites on Windows on demand, to measure that work,
# instead of failing on every pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Tests on windows-latest
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Use Git Bash for npm scripts
        run: npm config set script-shell "C:\\Program Files\\Git\\bin\\bash.exe"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Track Work tests
        run: npm run test:track-work

      - name: Pi extension tests
        # Runs even when Track Work's tests fail, so one run shows every failure.
        if: success() || failure()
        run: npm run test:pi-extension
