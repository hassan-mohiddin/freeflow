# Weekly update PRs, one per ecosystem. A release must be a week old first, so a compromised version has time to be
# caught. Pi's packages are left out: Freeflow moves to a new Pi version deliberately, with its tests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@earendil-works/*"
    groups:
      dev-dependencies:
        dependency-type: development
